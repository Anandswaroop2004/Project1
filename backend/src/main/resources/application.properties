# ===================================================================
# Military Asset Management System (MAMS) - Backend Configuration
# ===================================================================

spring.application.name=mams-backend
server.port=${PORT:8081}

# Database Configuration (H2 In-Memory Database with MySQL Mode)
spring.datasource.url=jdbc:h2:mem:military_asset_db;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true

# SQL Initializer
spring.sql.init.mode=always

# JWT Security Configuration
app.jwt.secret=9a6747f70c322c182d404f34a44694d4e3f829f99e32f9280140d4f5087d68cb
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.military.mams=INFO

# JSON Jackson Formatter
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
